<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interactive class </title>
    <link rel="stylesheet" href="">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: rgb(252, 249, 249);
        height: 100vh;
        display: flex;
        align-items: center;
        padding-left: 150px;
        color: white;
    }

    .container {
        width: 350px;
        height: 350px;
        background-color: rgb(3, 3, 39);
        padding-bottom: 100px;
        padding: 50px;
        border-radius: 17px;
        justify-items: center;
        margin-left: 100px;
    }

    .h2 {
        margin-bottom: 50px;
        padding-bottom: 100px;
        display: inline;
        padding-inline: 100px;
    }

    .rating {
        display: flex;
        justify-content: space-between;
        margin: 25px 0;
    }

    .star {
        border-radius: 5px;
        display: flex;
        align-content: center;
        justify-content: center;
        margin-bottom: 30px;
        padding-right: 250px;
    }

    h2 {
        padding-right: 10px;
        margin-bottom: 20px;
        border-radius: 50px;

    }

    .container {
        padding-bottom: 25px;
        padding-top: 25px;
    }

    .ratings {
        display: flex;
        margin: 25px;
        justify-content: space-between;
    }

    .submit-btn {
        background-color: orange;
        color: white;
        width: 100%;
        padding: 14px;
    }

    .submit-btn:hover {
        background-color: rgb(228, 218, 218);
        color: orange;
    }

    .hidden {
        display: none;
    }

    .thank-you IMG {
        text-align: center;
    }

    .thank-you {
        width: 140px;
        margin-bottom: 25px;
    }

    .selected {
        display: inline-block;
        background: rgb(233, 233, 241);
        padding: 10px 18px;
        border-radius: 20px;
        color: orange;
        margin-bottom: 25px;
    }

    .rate {
        color: white;
        background-color: rgb(43, 41, 41);
        width: 20px;
    }

    .sub {
        width: 300px;
        height: 50px;
        border-radius: 20px;
        color: white;
        background-color: rgb(245, 164, 13);
    }
</style>
</body>
<div class="container">
    <!-- Rating card -->
    <div class="card" id="rating-card">
        <div class="star">
            <img src="IMG-20260522-WA0011.jpg" alt="" width="25px" height="25px">
        </div>
        <h2>How did we do?</h2>
        <p>pleace let us know how we did with you suport request.
            All feedback is appreciated to help us improve our offering!
        </p>
        <div class="ratings">

            <button class="rate">1</button>
            <button class="rate">2</button>
            <button class="rate">3</button>
            <button class="rate">4</button>
            <button class="rate">5</button>
        </div>
        <button class="sub"> SUBMIT </button>
    </div>
    <!--Thank you card-->
    <div class="card thank-you hidden" id="thank-card">
        <img src="IMG-20260522-WA0010.jpg" alt="thank-you">
        <div class="selected" id="selected-rating">
            you selected 4 out 5
        </div>
        <h2> Thank you</h2>
        <p>
            we appreciate you taking the time to give a rating.
            if you ever need more support,
            don't hesitate to get in touch!
        </p>
    </div>
</div>
</body>

</html>
